name: Deploy to VPS

# Runs after CI passes on main (or by hand from the Actions tab). Skips quietly until the
# VPS_HOST and VPS_SSH_KEY secrets are set.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: cfg
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -n "$KEY" ] && [ -n "$HOST" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::VPS_HOST / VPS_SSH_KEY не заданы — публикация на сервер пропущена"; fi

      - uses: actions/checkout@v5
        if: steps.cfg.outputs.ready == 'true'

      - name: Update server over SSH
        if: steps.cfg.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30 "root@$HOST" 'bash -s' < deploy/update.sh
