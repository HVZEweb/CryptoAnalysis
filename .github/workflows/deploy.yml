name: Deploy to VPS

# Runs after CI passes on main (or by hand from the Actions tab). Skips quietly until the
# VPS_HOST and VPS_SSH_KEY secrets are set.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        id: cfg
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$KEY" ] && [ -n "$HOST" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::VPS_HOST / VPS_SSH_KEY не заданы — публикация на сервер пропущена"; fi

      - uses: actions/checkout@v5
        if: steps.cfg.outputs.ready == 'true'

      - name: Update server over SSH
        if: steps.cfg.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # Keys pasted from a Windows terminal arrive with CRLFs or flattened onto one line —
          # rebuild the PEM layout so either paste works.
          python3 - <<'PY'
          import os, re
          k = os.environ["KEY"].replace("\r", "").strip()
          m = re.match(r"(-----BEGIN [A-Z ]+-----)\s*(.*?)\s*(-----END [A-Z ]+-----)", k, re.S)
          if m:
              body = "".join(m.group(2).split())
              k = m.group(1) + "\n" + "\n".join(body[i:i + 70] for i in range(0, len(body), 70)) + "\n" + m.group(3)
          path = os.path.expanduser("~/.ssh/id_deploy")
          with open(path, "w") as f:
              f.write(k + "\n")
          os.chmod(path, 0o600)
          PY
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::VPS_SSH_KEY не похож на закрытый ключ. Нужен весь блок от -----BEGIN OPENSSH PRIVATE KEY----- до -----END OPENSSH PRIVATE KEY----- (файл без .pub)."
            exit 1
          fi
          ssh-keyscan -T 15 -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # The key travels inside the script on stdin, never on a command line the server could log.
          {
            if [ -n "$OPENROUTER_API_KEY" ]; then printf 'export OPENROUTER_API_KEY=%q\n' "$OPENROUTER_API_KEY"; fi
            cat deploy/update.sh
          } | ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o ServerAliveInterval=30 "root@$HOST" 'bash -s'
